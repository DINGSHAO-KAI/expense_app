<!DOCTYPE html>
<html>
<head>
    <title>新增消費</title>
</head>
<body>
    <h1>新增消費</h1>
    <form action="/add" method="POST">
        <label>標題：</label><br>
        <input name="title" required><br><br>

        <label>金額：</label><br>
        <input name="amount" type="number" step="0.01" required><br><br>

        <label>日期：</label><br>
        <input name="date" type="date" required><br><br>

        <button type="submit">送出</button>
    </form>
</body>
</html>
